all:
  hosts:
    sensor_target:
      ansible_host: 127.0.0.1
      ansible_port: 2222
      ansible_user: sensor
      ansible_connection: ssh
      ansible_python_interpreter: /usr/bin/python3
      ansible_ssh_private_key_file: /automation/sensor-lab-key
      ansible_ssh_common_args: "-o UserKnownHostsFile=/automation/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
