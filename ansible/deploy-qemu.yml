---
- name: Deploy and verify sensor application on QEMU
  hosts: sensor_target
  gather_facts: false
  become: true

  vars:
    app_version: "0.1.5"
    release_dir: "/opt/sensor-gateway/releases/{{ app_version }}"
    candidate_binary: "{{ release_dir }}/sensor-gateway"

  tasks:
    - name: Calculate source binary checksum inside Ansible runner
      ansible.builtin.stat:
        path: /automation/artifact/sensor-gateway
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: source_binary

    - name: Require the release binary
      ansible.builtin.assert:
        that:
          - source_binary.stat.exists
          - source_binary.stat.isreg | default(false)

    - name: Install C++ runtime dependencies on the target
      ansible.builtin.apt:
        name:
          - libstdc++6
          - libgcc-s1
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create versioned release directory
      ansible.builtin.file:
        path: "{{ release_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Transfer release binary
      ansible.builtin.copy:
        src: /automation/artifact/sensor-gateway
        dest: "{{ candidate_binary }}"
        owner: root
        group: root
        mode: '0755'

    - name: Calculate transferred binary checksum
      ansible.builtin.stat:
        path: "{{ candidate_binary }}"
        checksum_algorithm: sha256
      register: target_binary

    - name: Verify transfer integrity
      ansible.builtin.assert:
        that:
          - target_binary.stat.checksum == source_binary.stat.checksum
        success_msg: "Source and target SHA-256 checksums match."

    - name: Read candidate application version
      ansible.builtin.command:
        argv:
          - "{{ candidate_binary }}"
          - --version
      register: version_result
      changed_when: false

    - name: Verify expected application version
      ansible.builtin.assert:
        that:
          - version_result.stdout | trim == app_version

    - name: Run candidate sensor smoke test
      ansible.builtin.command:
        argv:
          - "{{ candidate_binary }}"
          - read
          - "25"
      register: smoke_result
      changed_when: false

    - name: Verify sensor response
      ansible.builtin.assert:
        that:
          - (smoke_result.stdout | from_json).state == 'NORMAL'

    - name: Activate verified application
      ansible.builtin.file:
        src: "{{ candidate_binary }}"
        dest: /usr/local/bin/sensor-gateway
        state: link
        owner: root
        group: root

    - name: Report deployment result
      ansible.builtin.debug:
        msg: "Application {{ app_version }} deployed, verified and activated on QEMU."
