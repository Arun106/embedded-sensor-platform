---
- name: Prepare and verify QEMU release candidate
  hosts: sensor_target
  gather_facts: false
  become: true
  vars:
    app_version: "{{ lookup('ansible.builtin.env', 'EXPECTED_VERSION') }}"
    release_dir: "/opt/sensor-gateway/releases/{{ app_version }}"
    candidate_binary: "{{ release_dir }}/sensor-gateway"
  tasks:
    - name: Validate requested version
      ansible.builtin.assert:
        that:
          - app_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
    - name: Calculate source checksum
      ansible.builtin.stat:
        path: /automation/artifact/sensor-gateway
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: source_binary
    - name: Require release binary
      ansible.builtin.assert:
        that:
          - source_binary.stat.exists
          - source_binary.stat.isreg | default(false)
    - name: Ensure C++ runtime libraries
      ansible.builtin.apt:
        name: [libstdc++6, libgcc-s1]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create versioned candidate directory
      ansible.builtin.file:
        path: "{{ release_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Transfer candidate binary
      ansible.builtin.copy:
        src: /automation/artifact/sensor-gateway
        dest: "{{ candidate_binary }}"
        owner: root
        group: root
        mode: '0755'
    - name: Calculate transferred checksum
      ansible.builtin.stat:
        path: "{{ candidate_binary }}"
        checksum_algorithm: sha256
      register: target_binary
    - name: Verify transfer integrity
      ansible.builtin.assert:
        that: target_binary.stat.checksum == source_binary.stat.checksum
    - name: Read candidate version
      ansible.builtin.command:
        argv: ["{{ candidate_binary }}", --version]
      register: candidate_version
      changed_when: false
    - name: Verify candidate version
      ansible.builtin.assert:
        that: candidate_version.stdout | trim == app_version
    - name: Run candidate smoke test
      ansible.builtin.command:
        argv: ["{{ candidate_binary }}", read, '25']
      register: smoke
      changed_when: false
    - name: Verify smoke response
      ansible.builtin.assert:
        that: (smoke.stdout | from_json).state == 'NORMAL'
    - name: Report candidate readiness
      ansible.builtin.debug:
        msg: "Candidate {{ app_version }} ready. Active application remains unchanged until target tests pass."
